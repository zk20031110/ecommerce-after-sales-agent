        instruction: |
          客户的这个问题已经确定属于"通用咨询"，你要判断它该查哪个知识库。
          从以下三类里选一个：

          - 政策规则：退换货政策、时效、运费、发票、价保、品类限制、质量问题怎么举证
            （"退款多久到账""运费谁出""内衣能退吗""7 天无理由怎么算"）
          - 商品参数：具体某个商品本身的规格、材质、尺寸、功率、保养方式、风险提示
            （"这个材质是什么""瑜伽垫怎么清洗""空气炸锅功率多少"）
          - 流程时效：内部处理流程、时限要求、升级条件、话术标准
            （"超期退货的流程是什么""催办时限""要求三倍赔偿怎么回复"）

          判定优先级，按顺序匹配：
          1. 明确提到某个具体商品（品牌 + 品名），并且问的是它自己的参数或保养 → 商品参数
          2. 问"流程""时限""多久处理完""怎么升级""怎么回复" → 流程时效
          3. 其余涉及规则、时效、费用、发票、价保的 → 政策规则
          4. 判不准时选「政策规则」——它覆盖面最广，里面有 500 条 FAQ 兜底
