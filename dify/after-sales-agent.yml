    - data:
        code: |
          import re


          def main(text: str, session_id: str = "") -> dict:
              """从客户消息里抽订单号和手机号后四位。

              phone_tail 只认「前后都不是数字的恰好 4 位数字」，
              所以订单号内部的 4 位数不会被误当成手机号尾号。
              大额退款需要它做身份核验，客户单独回一句 "2010" 也能被识别。

              订单号抽不到时返回空串，由后端回退到本会话记住的订单号——
              这样客户第二句说"好，退吧"就不用再报一次单号。
              """
              text = text or ""
              order_no = ""
              m = re.search(r"\b(\d{13,16})\b", text)
              if m:
                  order_no = m.group(1)
              else:
                  m2 = re.search(r"\b((?:SN|DD|ORD)[A-Za-z0-9]{6,})\b", text, re.IGNORECASE)
                  if m2:
                      order_no = m2.group(1)

              phone_tail = ""
              for mm in re.finditer(r"(?<!\d)(\d{4})(?!\d)", text):
                  phone_tail = mm.group(1)
                  break
              # 会话 ID 也一起透传出去：Dify 的 URL 查询参数里拿不到 sys 变量，
              # 但节点输出变量可以，所以让这个节点把它转一手。
              return {"order_no": order_no, "phone_tail": phone_tail,
                      "session_id": session_id or ""}
        code_language: python3
        outputs:
          order_no:
            children: null
            type: string
          phone_tail:
            children: null
            type: string
          session_id:
            children: null
            type: string
        selected: false
        title: 订单号抽取
        type: code
        variables:
        - value_selector:
          - sys
          - conversation_id
          variable: session_id
        - value_selector:
          - sys
          - query
          variable: text
