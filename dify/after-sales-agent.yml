    - data:
        code: |
          import re


          # 常见的中文回复里会被模型混进来的英文词
          FIX = {
              "frustration": "沮丧", "frustrated": "沮丧", "sorry": "抱歉",
              "apologize": "抱歉", "apologies": "抱歉", "ok": "好的",
              "okay": "好的", "thanks": "谢谢", "thank you": "谢谢",
              "problem": "问题", "issue": "问题", "delay": "延误",
              "refund": "退款", "order": "订单", "please": "请",
          }


          def main(text: str) -> dict:
              """把中文回复里混进来的英文词替换成中文。

              为什么需要这一步：提示词里已经明确要求"只用简体中文"，但
              qwen 是多语言模型，表达情绪时有概率漂移到英文（实测输出过
              "很理解您此刻的 frustration"）。提示词是软约束，这里是硬保险。

              关键细节：英文编号（TK26100409594801、SKU 号）不能动，
              所以只替换词表里的词，再把剩下孤立的英文单词报出来供排查。
              """
              out = text or ""
              for en, cn in FIX.items():
                  # 顺手吃掉前面的空白，"此刻的 frustration" 才不会变成"此刻的 沮丧"
                  out = re.sub(r"\s*(?<![A-Za-z0-9])" + re.escape(en) + r"(?![A-Za-z0-9])",
                               cn, out, flags=re.IGNORECASE)
              # 编号里的字母（如 TK26100409594801）前后紧邻数字，不会被匹配
              leftover = re.findall(r"(?<![A-Za-z0-9])([A-Za-z]{3,})(?![A-Za-z0-9])", out)
              return {"reply": out, "leftover_en": ",".join(leftover)}
        code_language: python3
        desc: 把模型偶尔混进来的英文词替换成中文，编号保持不动
        outputs:
          leftover_en:
            children: null
            type: string
          reply:
            children: null
            type: string
        selected: false
        title: 清洗回复
        type: code
        variables:
        - value_selector:
          - '1800000000017'
          - text
          variable: text
