# ============================================================================
# 售后客服 Agent · 完整版 DSL（通义千问 + 真实工具调用）
#
# DSL 版本 0.7.0 / provider: langgenius/tongyi/tongyi / model: qwen-plus
# 插件依赖：langgenius/tongyi（见文件底部 dependencies 段）
#
# 相比原来的骨架，这一版把 3 条占位分支接成了真能力：
#   物流查询   → 抽订单号 → 调后端查真实物流 → qwen 话术化
#   退款退货   → 调后端判资格（7天/已使用/超期）→ qwen 给方案
#   换货       → 调后端判换货资格 → qwen 给方案
#   投诉/转人工 → 调后端建真实工单 → qwen 安抚并给工单号
#   通用咨询   → 知识库检索 → qwen 回答（沿用原来的）
#
# 知识库检索节点挂的是**三个库**（政策与FAQ / 产品手册 / 流程与话术），不是一个大库。
# 原因见 README「知识库怎么分」：混在一起会串味，实测素材类型命中率只有 43%，拆开后 93%。
# 换知识库时 dataset_ids 必须同步改——填错不会报错，只是永远检索不到东西。
#
# 提示词集中管理在 prompts/reply_prompts.md，分类器的 instruction 见
# prompts/classifier_instruction.txt，改提示词时两处要同步。
#
# 导入前必须确认一件事：mock 后端正在运行，且 Dify 容器能访问到它。
# 地址写的是 http://host.docker.internal:8000（容器访问宿主机的标准写法）。
# 如果运行时报连接失败，先跑这条命令确认：
#     docker exec -it docker-api-1 curl -s http://host.docker.internal:8000/health
# ============================================================================
